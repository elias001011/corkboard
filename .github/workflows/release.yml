name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
            files: |
              release/*.deb
              release/*.AppImage
          - os: windows-latest
            script: dist:win
            files: |
              release/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          NODE_ENV: production
          # sem assinatura de código em nenhuma plataforma
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: corkboard-${{ matrix.os }}
          path: ${{ matrix.files }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
